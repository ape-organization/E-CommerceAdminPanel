
<div class="management-container">

  <!-- HEADER -->
  <header class="header-actions">

    <div class="page-heading">

      <div class="heading-icon">
        <mat-icon>category</mat-icon>
      </div>

      <div>
        <h2>{{ 'categories.management' | translate }}</h2>
        <p>{{ 'categories.description' | translate }}</p>
      </div>

    </div>

    <button
      mat-raised-button
      class="add-category-btn"
      type="button"
      (click)="showAddCategory()">

      <mat-icon>add</mat-icon>

      {{ 'categories.addCategory' | translate }}

    </button>

  </header>


  <!-- TABLE -->
  <div class="table-responsive">

    <table
      mat-table
      [dataSource]="paginatedCategories()">


      <!-- CATEGORY -->
      <ng-container matColumnDef="name">

        <th mat-header-cell *matHeaderCellDef>
          {{ 'categories.category' | translate }}
        </th>

        <td
          mat-cell
          *matCellDef="let category"
          class="category-name">

          <div class="category-name-wrapper">

            <div class="category-image-wrapper">

              @if (category.imageUrl) {

                <img
                  class="category-image"
                  [src]="getImageUrl(category.imageUrl)"
                  [alt]="category.name">

              } @else {

                <mat-icon class="category-image-placeholder">
                  category
                </mat-icon>

              }

            </div>

            <span class="category-name-text">
              {{ category.nameEn }}
            </span>
  <span class="category-name-text">
              {{ category.nameAr }}
            </span>
          </div>

        </td>

      </ng-container>


   


      <!-- ACTIONS -->
      <ng-container matColumnDef="actions">

        <th
          mat-header-cell
          *matHeaderCellDef
          class="actions-header">

          {{ 'common.actions' | translate }}

        </th>

        <td
          mat-cell
          *matCellDef="let category"
          class="actions-cell">

          <button
            mat-icon-button
            class="edit-btn"
            type="button"
            (click)="editCategory(category)">

            <mat-icon>edit</mat-icon>

          </button>

          <button
            mat-icon-button
            class="delete-btn"
            type="button"
            (click)="deleteCategory(category.id)">

            <mat-icon>delete</mat-icon>

          </button>

        </td>

      </ng-container>


      <!-- ROWS -->
      <tr
        mat-header-row
        *matHeaderRowDef="displayedColumns">
      </tr>

      <tr
        mat-row
        *matRowDef="
          let row;
          columns: displayedColumns;
        ">
      </tr>

    </table>


    <!-- PAGINATION -->
    <mat-paginator
      [length]="categories().length"
      [pageIndex]="pageIndex()"
      [pageSize]="pageSize()"
      [pageSizeOptions]="[5, 10, 25, 50]"
      showFirstLastButtons
      (page)="onPageChange($event)">
    </mat-paginator>

  </div>

</div>
