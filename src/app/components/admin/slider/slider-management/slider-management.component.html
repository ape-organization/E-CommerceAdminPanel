
<div class="management-container">

  <!-- HEADER -->
  <header class="header-actions">

    <div class="page-heading">

      <div class="heading-icon">
        <mat-icon>home</mat-icon>
      </div>

      <div>
        <h2>{{ 'sliders.management' | translate }}</h2>
        <p>{{ 'sliders.description' | translate }}</p>
      </div>

    </div>

    <button
      mat-raised-button
      class="add-category-btn"
      type="button"
      (click)="showAddSlider()">

      <mat-icon>add</mat-icon>

      {{ 'sliders.addSlider' | translate }}

    </button>

  </header>


  <!-- LIST -->
  <div class="entity-list grid">

    @for (slider of paginatedCategories(); track $index) {

      <article class="entity-card slider-card">

        <!-- IMAGE -->
        <div class="slider-media">

          @if (slider.imageUrl) {

            <img loading="lazy" decoding="async" [src]="getImageUrl(slider.imageUrl)">

          } @else {

            <mat-icon>home</mat-icon>

          }

        </div>


        <div class="slider-footer">

          <span class="field-label">
            {{ 'sliders.slider' | translate }}
          </span>

          <!-- ACTIONS -->
          <div class="entity-actions">

            <button
              mat-icon-button
              class="edit-btn"
              type="button"
              (click)="editSlider(slider)"
              [attr.aria-label]="'common.edit' | translate">

              <mat-icon>edit</mat-icon>

            </button>

          </div>

        </div>

      </article>

    } @empty {

      <div class="entity-empty">

        <mat-icon>home</mat-icon>

        <span>
          {{ 'common.noData' | translate }}
        </span>

      </div>

    }

  </div>


  <!-- PAGINATION -->
  <div class="list-pagination">

    <mat-paginator
      [selectConfig]="{ panelClass: 'paginator-size-panel' }"
      [length]="sliders().length"
      [pageIndex]="pageIndex()"
      [pageSize]="pageSize()"
      [pageSizeOptions]="[5, 10, 25, 50]"
      showFirstLastButtons
      (page)="onPageChange($event)">
    </mat-paginator>

  </div>

</div>
