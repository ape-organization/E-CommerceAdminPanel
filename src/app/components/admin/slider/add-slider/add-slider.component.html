
<div class="modal-overlay">

  <div class="modal-container">

    <!-- =====================================================
         HEADER
         ===================================================== -->

    <div class="modal-header">

      <div class="header-title">

        <div class="title-icon">

          <mat-icon>
            home
          </mat-icon>

        </div>


        <div>

          <h2>
            Slider
          </h2>

          <p>
          Add slider for the home page 
          </p>

        </div>

      </div>


      <button
        mat-icon-button
        type="button"
        class="close-button"
        (click)="onCancel()"
        [disabled]="isSubmitting()"
        [attr.aria-label]="'common.close' | translate"
      >

        <mat-icon>
          close
        </mat-icon>

      </button>

    </div>


    <!-- =====================================================
         FORM
         ===================================================== -->

    <form
      [formGroup]="sliderForm"
      (ngSubmit)="onSubmit()"
    >

      <div class="form-content">


        <!-- =================================================
             IMAGE
             ================================================= -->

        <div class="image-upload-section">

          <div
            class="image-preview-wrapper"
            (click)="fileInput.click()"
          >

            @if (imagePreview()) {

              <img
                [src]="imagePreview()"
                [alt]="
                  sliderForm.get('name')?.value ||
                  ('slider.sliderImage' | translate)
                "
                class="category-image-preview"
              />

            }


            @if (!imagePreview()) {

              <div class="image-placeholder">

                <mat-icon>
                  cloud_upload
                </mat-icon>

                <span>
                  {{ 'sliders.chooseImage' | translate }}
                </span>

              </div>

            }


            <div class="image-hover-overlay">

              <mat-icon>
                photo_camera
              </mat-icon>

              <span>
                {{ 'sliders.changeImage' | translate }}
              </span>

            </div>

          </div>


          <input
            #fileInput
            type="file"
            accept="image/*"
            hidden
            (change)="onImageSelected($event)"
          />

        </div>


     
        <!-- =================================================
             ERROR
             ================================================= -->

        @if (errorMessage()) {

          <div class="error-message">

            <mat-icon>
              error_outline
            </mat-icon>

            <span>
              {{ errorMessage() }}
            </span>

          </div>

        }

      </div>


      <!-- =====================================================
           ACTIONS
           ===================================================== -->

      <div class="modal-actions">

        <button
          mat-button
          type="button"
          class="cancel-button"
          (click)="onCancel()"
          [disabled]="isSubmitting()"
        >

          {{ 'common.cancel' | translate }}

        </button>


        <button
          mat-raised-button
          type="submit"
          class="submit-button"
          [disabled]="
            sliderForm.invalid ||
            isSubmitting()
          "
        >

          <mat-icon>
            {{ submitIcon() }}
          </mat-icon>

          {{ submitText() }}

        </button>

      </div>

    </form>

  </div>

</div>
