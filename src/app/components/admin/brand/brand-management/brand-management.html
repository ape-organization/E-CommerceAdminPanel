<div class="management-container">

  <!-- HEADER -->
  <div class="header-actions">

    <div class="page-heading">

      <div class="heading-icon">
        <mat-icon>verified</mat-icon>
      </div>

      <div>
        <h2>
          {{ 'brands.management' | translate }}
        </h2>

        <p>
          {{ 'brands.description' | translate }}
        </p>
      </div>

    </div>


    <!-- ADD BRAND -->
    <button
      mat-raised-button
      class="add-brand-btn"
      type="button"
      (click)="showAddBrand()">

      <mat-icon>add</mat-icon>

      {{ 'brands.addBrand' | translate }}

    </button>

  </div>


  <!-- TABLE -->
  <div class="table-responsive">

    <table
      mat-table
      [dataSource]="dataSource()">

      <!-- ===================================================== -->
      <!-- BRAND -->
      <!-- ===================================================== -->

      <ng-container matColumnDef="image">

        <th
          mat-header-cell
          *matHeaderCellDef>

       

        </th>


        <td
          mat-cell
          *matCellDef="let brand">

          <div class="brand-wrapper">

            <!-- BRAND IMAGE -->
            <div class="brand-image-wrapper">

              <img
                *ngIf="brand.imageUrl"
                [src]="getImageUrl(brand.imageUrl)"
                [alt]="
                  languageService.currentLanguage() === 'ar'
                    ? brand.nameAr
                    : brand.nameEn
                "
                class="brand-image"
              />

              <mat-icon
                *ngIf="!brand.imageUrl">

                image

              </mat-icon>

            </div>


                  </div>

        </td>

      </ng-container>
<ng-container matColumnDef="nameEn">

        <th
          mat-header-cell
          *matHeaderCellDef>

          {{ 'brands.nameEn' | translate }}

        </th>


        <td
          mat-cell
          *matCellDef="let brand">

          <div class="brand-wrapper">

         


            <!-- BRAND NAME -->
            <span class="brand-name">

              {{
              brand.nameEn
              }}

            </span>
          </div>

        </td>

      </ng-container>
      <ng-container matColumnDef="nameAr">

        <th
          mat-header-cell
          *matHeaderCellDef>

          {{ 'brands.nameAr' | translate }}

        </th>


        <td
          mat-cell
          *matCellDef="let brand">

          <div class="brand-wrapper">



 <span class="brand-name">

              {{
                brand.nameAr
                 
              }}

            </span>
          </div>

        </td>

      </ng-container>

      <!-- ===================================================== -->
      <!-- ACTIONS -->
      <!-- ===================================================== -->

      <ng-container matColumnDef="actions">

        <th
          mat-header-cell
          *matHeaderCellDef
          class="actions-header">

          {{ 'common.actions' | translate }}

        </th>


        <td
          mat-cell
          *matCellDef="let brand"
          class="actions-cell">


          <!-- EDIT -->
          <button
            mat-icon-button
            class="edit-btn"
            type="button"
            (click)="editBrand(brand)"
            [attr.aria-label]="'common.edit' | translate">

            <mat-icon>
              edit
            </mat-icon>

          </button>


          <!-- DELETE -->
          <button
            mat-icon-button
            class="delete-btn"
            type="button"
            (click)="deleteBrand(brand.id)"
            [attr.aria-label]="'common.delete' | translate">

            <mat-icon>
              delete
            </mat-icon>

          </button>

        </td>

      </ng-container>


      <!-- ===================================================== -->
      <!-- HEADER ROW -->
      <!-- ===================================================== -->

      <tr
        mat-header-row
        *matHeaderRowDef="displayedColumns">
      </tr>


      <!-- ===================================================== -->
      <!-- DATA ROW -->
      <!-- ===================================================== -->

      <tr
        mat-row
        *matRowDef="
          let row;
          columns: displayedColumns;
        ">
      </tr>


      <!-- ===================================================== -->
      <!-- NO DATA -->
      <!-- ===================================================== -->

      <tr
        class="mat-row"
        *matNoDataRow>

        <td
          class="mat-cell no-data"
          [attr.colspan]="displayedColumns.length">

          {{ 'common.noData' | translate }}

        </td>

      </tr>

    </table>


    <!-- ======================================================= -->
    <!-- PAGINATION -->
    <!-- ======================================================= -->

    <mat-paginator
      [length]="brands().length"
      [pageSize]="pageSize()"
      [pageIndex]="pageIndex()"
      [pageSizeOptions]="[5, 10, 25]"
      showFirstLastButtons
      (page)="onPageChange($event)">

    </mat-paginator>

  </div>

</div>
