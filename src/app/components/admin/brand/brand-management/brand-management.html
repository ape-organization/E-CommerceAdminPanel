<div class="management-container">


  <!-- =========================================
       HEADER
       ========================================= -->

  <div class="header-actions">

    <div class="page-heading">

      <span class="heading-icon">
        verified
      </span>

      <div>

        <h2>
          Brand Management
        </h2>

        <p>
          Manage your cosmetic brands
        </p>

      </div>

    </div>


    <button
      mat-raised-button
      class="add-brand-btn"
      (click)="showAddBrand()"
    >

      <mat-icon>
        add
      </mat-icon>

      Add Brand

    </button>

  </div>


  <!-- =========================================
       TABLE
       ========================================= -->

  <div class="table-responsive">

    <table
      mat-table
      [dataSource]="dataSource"
    >


      <!-- =====================================
           BRAND
           ===================================== -->

      <ng-container
        matColumnDef="name"
      >

        <th
          mat-header-cell
          *matHeaderCellDef
        >

          Brand

        </th>


        <td
          mat-cell
          *matCellDef="let brand"
          class="brand-name"
        >

          <div class="brand-wrapper">


            <!-- IMAGE -->

            <div class="brand-image-wrapper">

              <img
                *ngIf="brand.imageUrl"
                [src]="getImageUrl(brand.imageUrl)"
                [alt]="brand.name"
                class="brand-image"
              />


              <mat-icon
                *ngIf="!brand.imageUrl"
                class="brand-placeholder"
              >
                image
              </mat-icon>

            </div>


            <!-- NAME -->

            <span>
              {{ brand.name }}
            </span>

          </div>

        </td>

      </ng-container>


      <!-- =====================================
           ACTIONS
           ===================================== -->

      <ng-container
        matColumnDef="actions"
      >

        <th
          mat-header-cell
          *matHeaderCellDef
          class="actions-header"
        >

          Actions

        </th>


        <td
          mat-cell
          *matCellDef="let brand"
          class="actions-cell"
        >


          <!-- EDIT -->

          <button
            mat-icon-button
            class="edit-btn"
            matTooltip="Edit brand"
            (click)="editBrand(brand)"
          >

            <mat-icon>
              edit
            </mat-icon>

          </button>


          <!-- DELETE -->

          <button
            mat-icon-button
            class="delete-btn"
            matTooltip="Delete brand"
            (click)="deleteBrand(brand.id)"
          >

            <mat-icon>
              delete
            </mat-icon>

          </button>

        </td>

      </ng-container>


      <!-- =====================================
           ROWS
           ===================================== -->

      <tr
        mat-header-row
        *matHeaderRowDef="displayedColumns"
      ></tr>


      <tr
        mat-row
        *matRowDef="
          let row;
          columns: displayedColumns;
        "
      ></tr>


    </table>

  </div>

</div>
