<div class="management-container">

  <!-- HEADER -->
  <div class="header-actions">

    <div class="page-heading">

      <div class="heading-icon">
        <mat-icon>verified</mat-icon>
      </div>

      <div>
        <h2>BRAND MANAGEMENT</h2>
        <p>Manage your cosmetic brands</p>
      </div>

    </div>

    <button
      mat-raised-button
      class="add-brand-btn"
      type="button"
      (click)="showAddBrand()">

      <mat-icon>add</mat-icon>
      Add Brand

    </button>

  </div>


  <!-- TABLE -->
  <div class="table-responsive">

    <table
      mat-table
      [dataSource]="dataSource()">

      <!-- BRAND -->
      <ng-container matColumnDef="name">

        <th mat-header-cell *matHeaderCellDef>
          Brand
        </th>

        <td mat-cell *matCellDef="let brand">

          <div class="brand-wrapper">

            <div class="brand-image-wrapper">

              <img
                *ngIf="brand.imageUrl"
                [src]="getImageUrl(brand.imageUrl)"
                [alt]="brand.name"
                class="brand-image"
              />

              <mat-icon *ngIf="!brand.imageUrl">
                image
              </mat-icon>

            </div>

            <span class="brand-name">
              {{ brand.name }}
            </span>

          </div>

        </td>

      </ng-container>


      <!-- ACTIONS -->
      <ng-container matColumnDef="actions">

        <th
          mat-header-cell
          *matHeaderCellDef
          class="actions-header">

          Actions

        </th>

        <td
          mat-cell
          *matCellDef="let brand"
          class="actions-cell">

          <button
            mat-icon-button
            class="edit-btn"
            type="button"
            matTooltip="Edit brand"
            (click)="editBrand(brand)">

            <mat-icon>edit</mat-icon>

          </button>

          <button
            mat-icon-button
            class="delete-btn"
            type="button"
            matTooltip="Delete brand"
            (click)="deleteBrand(brand.id)">

            <mat-icon>delete</mat-icon>

          </button>

        </td>

      </ng-container>


      <!-- ROWS -->
      <tr
        mat-header-row
        *matHeaderRowDef="displayedColumns">
      </tr>

      <tr
        mat-row
        *matRowDef="
          let row;
          columns: displayedColumns;
        ">
      </tr>

    </table>


    <!-- PAGINATION -->
    <mat-paginator
      [length]="brands().length"
      [pageSize]="pageSize()"
      [pageIndex]="pageIndex()"
      [pageSizeOptions]="[5, 10, 25]"
      showFirstLastButtons
      (page)="onPageChange($event)">
    </mat-paginator>

  </div>

</div>
