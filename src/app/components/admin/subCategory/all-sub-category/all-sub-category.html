<div class="management-container">

  <!-- =====================================================
       HEADER
       ===================================================== -->

  <header class="header-actions">

    <div class="page-heading">

      <div class="heading-icon">

        <mat-icon>
          account_tree
        </mat-icon>

      </div>

      <div>

        <h2>
          Subcategory Management
        </h2>

        <p>
          Manage your store subcategories
        </p>

      </div>

    </div>


    <!-- ADD -->

    <button
      mat-raised-button
      class="add-category-btn"
      type="button"
      (click)="showAddSubcategory()"
    >

      <mat-icon>
        add
      </mat-icon>

      Add Subcategory

    </button>

  </header>


  <!-- =====================================================
       TABLE
       ===================================================== -->

  <div class="table-responsive">

    <table
      mat-table
      [dataSource]="paginatedSubcategories()"
    >


      <!-- =================================================
           SUBCATEGORY
           ================================================= -->

      <ng-container matColumnDef="name">

        <th
          mat-header-cell
          *matHeaderCellDef
        >

          Subcategory

        </th>


        <td
          mat-cell
          *matCellDef="let subcategory"
          class="category-name"
        >

          <div class="category-name-wrapper">

            <div class="category-icon">

              <mat-icon>
                account_tree
              </mat-icon>

            </div>


            <span class="category-name-text">

              {{ subcategory.name }}

            </span>

          </div>

        </td>

      </ng-container>


      <!-- =================================================
           CATEGORY
           ================================================= -->

      <ng-container matColumnDef="category">

        <th
          mat-header-cell
          *matHeaderCellDef
        >

          Category

        </th>


        <td
          mat-cell
          *matCellDef="let subcategory"
          class="category-column"
        >

          <span class="parent-category">

            <mat-icon>
              category
            </mat-icon>

            {{
              getCategoryName(
                subcategory.categoryId
              )
            }}

          </span>

        </td>

      </ng-container>




      <!-- =================================================
           ACTIONS
           ================================================= -->

      <ng-container matColumnDef="actions">

        <th
          mat-header-cell
          *matHeaderCellDef
          class="actions-header"
        >

          Actions

        </th>


        <td
          mat-cell
          *matCellDef="let subcategory"
          class="actions-cell"
        >

          <!-- EDIT -->

          <button
            mat-icon-button
            class="edit-btn"
            type="button"
            (click)="editSubcategory(subcategory)"
          >

            <mat-icon>
              edit
            </mat-icon>

          </button>


          <!-- DELETE -->

          <button
            mat-icon-button
            class="delete-btn"
            type="button"
            (click)="deleteSubcategory(subcategory.id)"
          >

            <mat-icon>
              delete
            </mat-icon>

          </button>

        </td>

      </ng-container>


      <!-- =================================================
           HEADER / ROWS
           ================================================= -->

      <tr
        mat-header-row
        *matHeaderRowDef="displayedColumns"
      >
      </tr>


      <tr
        mat-row
        *matRowDef="
          let row;
          columns: displayedColumns;
        "
      >
      </tr>

    </table>


    <!-- =================================================
         PAGINATION
         ================================================= -->

    <mat-paginator
      [length]="subcategories().length"
      [pageIndex]="pageIndex()"
      [pageSize]="pageSize()"
      [pageSizeOptions]="[5, 10, 25, 50]"
      showFirstLastButtons
      (page)="onPageChange($event)"
    >
    </mat-paginator>

  </div>

</div>
